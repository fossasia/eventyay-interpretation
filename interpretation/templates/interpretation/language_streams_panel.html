{% load i18n %}
<form method="post" class="interpretation-language-streams-form">
    {% csrf_token %}
    <input type="hidden" name="{{ room_id_key }}" value="{{ entry.room.pk }}">
    <input type="hidden" name="{{ streams_prefix }}-count" value="{{ stream_rows|length }}">

    <h4 class="interpretation-subsection-title">{% trans "Language streams (video room)" %}</h4>
    <p class="interpretation-section-hint">
        {% trans "Attendee audio translation channels. Use a YouTube video ID or a WHEP URL for each language. Requires “Use plugin language streams” on the overview page." %}
    </p>

    <div class="interpretation-language-stream-rows">
        {% for row in stream_rows %}
            <div class="interpretation-language-stream-row">
                <div class="form-group">
                    <label for="{{ streams_prefix }}-{{ forloop.counter0 }}-language">
                        {% trans "Language" %}
                    </label>
                    <input type="text"
                           class="form-control"
                           id="{{ streams_prefix }}-{{ forloop.counter0 }}-language"
                           name="{{ streams_prefix }}-{{ forloop.counter0 }}-language"
                           value="{{ row.language }}"
                           placeholder="{% trans 'German' %}">
                </div>
                <div class="form-group">
                    <label for="{{ streams_prefix }}-{{ forloop.counter0 }}-audio_source">
                        {% trans "Audio source (YouTube ID or WHEP URL)" %}
                    </label>
                    <input type="text"
                           class="form-control"
                           id="{{ streams_prefix }}-{{ forloop.counter0 }}-audio_source"
                           name="{{ streams_prefix }}-{{ forloop.counter0 }}-audio_source"
                           value="{{ row.youtube_id }}"
                           placeholder="https://whep.example.com/...">
                </div>
                <div class="checkbox">
                    <label>
                        <input type="checkbox"
                               name="{{ streams_prefix }}-{{ forloop.counter0 }}-use_video"
                               {% if row.use_video %}checked{% endif %}>
                        {% trans "Use video from this channel" %}
                    </label>
                </div>
            </div>
        {% endfor %}
    </div>

    <div class="interpretation-room-form-actions">
        <button type="submit" name="{{ room_action_key }}" value="save_streams" class="btn btn-default">
            {% trans "Save language streams" %}
        </button>
    </div>
</form>
