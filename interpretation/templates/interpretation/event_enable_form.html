{% load i18n %}
<form method="post" class="interpretation-event-settings-form">
    {% csrf_token %}
    <div class="checkbox">
        <label>
            {{ form.interpretation_is_enabled }}
            {{ form.interpretation_is_enabled.label }}
        </label>
    </div>
    <div class="checkbox">
        <label>
            {{ form.interpretation_use_plugin_streams }}
            {{ form.interpretation_use_plugin_streams.label }}
        </label>
    </div>
    {% if form.interpretation_use_plugin_streams.help_text %}
        <p class="help-block">{{ form.interpretation_use_plugin_streams.help_text }}</p>
    {% endif %}
    <button type="submit"
            name="{{ event_settings_save_key }}"
            value="1"
            class="btn btn-primary btn-save">
        {% trans "Save" %}
    </button>
</form>
