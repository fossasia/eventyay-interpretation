{% load i18n %}
<form method="post">
    {% csrf_token %}
    <div class="form-group">
        <div class="checkbox">
            <label>
                {{ form.interpretation_is_enabled }}
                {{ form.interpretation_is_enabled.label }}
            </label>
        </div>
    </div>
    <button type="submit"
            name="{{ event_settings_save_key }}"
            value="1"
            class="btn btn-primary">
        {% trans "Save" %}
    </button>
</form>
