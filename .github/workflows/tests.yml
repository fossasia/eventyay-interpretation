name: Tests

permissions:
  contents: read

on:
  push:
    branches: [ main, master, dev ]
    paths-ignore:
      - 'interpretation/locale/**'
  pull_request:
    branches: [ main, master, dev ]
    paths-ignore:
      - 'interpretation/locale/**'

jobs:
  test:
    runs-on: ubuntu-latest
    name: Tests

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eventyay-db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout eventyay-interpretation plugin
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Clone eventyay
        run: |
          git clone --depth 1 --branch dev https://github.com/fossasia/eventyay.git ../eventyay

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gettext libjpeg-dev zlib1g-dev libpq-dev

      - name: Set up eventyay environment
        run: |
          cd ../eventyay/app
          uv sync --all-extras --all-groups
          uv pip install -e "../../$(basename "$GITHUB_WORKSPACE")"

      - name: Compile translations
        run: |
          . ../eventyay/app/.venv/bin/activate
          make

      - name: Run checks
        env:
          EVY_RUNNING_ENVIRONMENT: testing
          EVY_POSTGRES_HOST: localhost
          EVY_POSTGRES_PORT: 5432
          EVY_POSTGRES_USER: postgres
          EVY_POSTGRES_PASSWORD: postgres
          EVY_POSTGRES_DB: eventyay-db
          EVY_REDIS_URL: redis://localhost:6379/0
          DJANGO_SETTINGS_MODULE: eventyay.config.settings
          PYTHONPATH: ${{ github.workspace }}/../eventyay/app
        run: |
          cd ../eventyay/app
          . .venv/bin/activate
          cd ../../eventyay-interpretation
          pytest tests
